[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "earnings-bench"
version = "0.1.0"
description = "Benchmark + agentic analyst + ML drift detection over SEC earnings call transcripts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Divya Dhole" }]

dependencies = [
    "pydantic>=2.6",
    "snowflake-connector-python>=3.7",
    "snowflake-sqlalchemy>=1.5",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "click>=8.1",
    "rich>=13.7",
    "httpx>=0.27",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dbt = ["dbt-core>=1.8", "dbt-snowflake>=1.8"]
llm = ["litellm>=1.40", "openai>=1.30", "anthropic>=0.30"]
agent = ["langgraph>=0.2", "langchain>=0.3", "sentence-transformers>=3.0"]
ml = ["scikit-learn>=1.5", "xgboost>=2.0", "shap>=0.45", "mlflow>=2.14", "evidently>=0.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=6.29",
]

[project.scripts]
earnings-bench = "earnings_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
# N803/N806: ML code conventionally uses X, y, X_train, X_test — don't fight it
# F841: MLflow `with start_run(...) as run` keeps the handle for debugging
ignore = ["N803", "N806", "F841"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
